openapi: "3.1.0"
info:
  title: SDG Commons Reports Scraper API
  version: "1.0.0"
  description: >
    API for scraping UNDP reports, uploading files, saving to DB and embedding documents.
    The scraper runs automatically every Monday at 00:00 UTC. Each run checks the following
    websites for new reports and will add any newly discovered reports to the SDG Commons:
      - https://www.undp.org/digital/dra
      - https://www.undp.org/digital/aila

    In addition to the scheduled scraper, the API supports manual workflows:
      - Upload a report file (PDF, DOCX, HTML, or plain text) to parse it and optionally save
        and/or embed it into the SDG Commons.
      - Provide a report URL to have the service scrape, parse, and optionally save/embed the report
        into the SDG Commons.

servers:
  - url: /
security:
  - ApiKeyAuth: []
tags:
  - name: Report Scraper
    description: Endpoints for scraping and processing UNDP reports (AILA/DRA)
  - name: AcceleratorLab Scanner
    description: Endpoints for scanning and classifying AcceleratorLab country office content
paths:
  /health:
    get:
      tags:
        - Report Scraper
      summary: Health check
      responses:
        "200":
          description: Healthy
        "503":
          description: Unhealthy
  /scraper/status:
    get:
      tags:
        - Report Scraper
      summary: Scraper status
      responses:
        "200":
          description: Status info
  /scraper/run:
    post:
      tags:
        - Report Scraper
      summary: Trigger scheduled scraper (background)
      responses:
        "202":
          description: Started
  /scraper/rescrape-high-relevance:
    post:
      tags:
        - Report Scraper
      summary: Re-scrape high relevance articles for PDF content
      description: >
        Re-scrape all articles with relevance >= 2 to try to extract PDF content and update 
        the database and NLP embeddings. This operation requires API key authentication and 
        runs in the background. Articles are only updated if significantly more content is 
        extracted compared to their current content.
      responses:
        "202":
          description: Re-scrape process started
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  description:
                    type: string
        "401":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Scraper already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /scraper/upload:
    post:
      tags:
        - Report Scraper
      summary: Upload a file, parse it and optionally save/embed
      description: >
        Upload a file (PDF, DOCX, HTML or plain text). Set `save=true` to persist the parsed document
        (when saving, the request must include the API key either as header X-API-KEY or query param `api_key`).
        To request embedding, provide a JSON string in the `embed` form field matching the EmbedPayload schema.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: URL of the document being uploaded (for record-keeping)
                  required: true
                  example: "https://example.com"
                file:
                  type: string
                  format: binary
                  description: Document to upload (PDF/DOCX/HTML/TXT)
                report_type:
                  type: string
                  description: Optional report type (e.g. AILA, DRA)
                country:
                  type: string
                  description: Optional country name
                title:
                  type: string
                  description: Optional title to use instead of generated title
                save:
                  type: boolean
                  description: When true the request will save the parsed document to DB (requires API key)
                embed:
                  type: string
                  description: >-
                    Optional JSON string (must be a JSON object) that conforms to the EmbedPayload schema.
                    Example: '{"token":"...","write_access":"...","api_url":"https://nlp.example","db":"mydb","prefix":"doc"}'
              required:
                - file
      responses:
        "200":
          description: Parsed but not saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleData'
        "201":
          description: Saved (and possibly embedded)
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved_id:
                    type: integer
                  embedded:
                    type: boolean
                  article_data:
                    $ref: '#/components/schemas/ArticleData'
  /scraper/scrape:
    post:
      tags:
        - Report Scraper
      summary: Scrape a URL, optionally save and embed
      description: >
        Scrape an URL and return parsed content. To persist the parsed document set `save: true`
        (when saving the request must include the API key either as header X-API-KEY or query param `api_key`).
        Embedding requires a full EmbedPayload object and only works for saved documents (or provide existing main_id).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: URL to scrape
                report_type:
                  type: string
                  description: Optional report type hint (AILA/DRA)
                country:
                  type: string
                title:
                  type: string
                  description: Optional title to override parsed title
                save:
                  type: boolean
                  default: false
                  description: When true, save parsed document (requires API key)
                embed:
                  $ref: '#/components/schemas/EmbedPayload'
              required:
                - url
      responses:
        "200":
          description: Parsed (and possibly saved/embedded)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  parsed_success:
                    type: boolean
                  article_data:
                    $ref: '#/components/schemas/ArticleData'
                  saved_id:
                    type: integer
                    nullable: true
                  embedded:
                    type: boolean
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /acceleratorlab/scan/start:
    post:
      tags:
        - AcceleratorLab Scanner
      summary: Start AcceleratorLab country scan
      description: >
        Initiates a scan of all UNDP country offices to find and classify AcceleratorLab articles.
        The scan runs asynchronously in the background and can take several hours to complete.
        Requires API key authentication.
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Scan started successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        "400":
          description: Scan already running or other error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
        "401":
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /acceleratorlab/scan/continue:
    post:
      tags:
        - AcceleratorLab Scanner
      summary: Continue/resume interrupted scan
      description: >
        Manually resume a scan that was interrupted (e.g., server restart, error, etc.).
        The scan will automatically skip already-processed countries and continue from where it left off.
        This endpoint can also be used to restart a completed or errored scan.
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Scan resumed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        "400":
          description: Cannot resume (scan already running)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
        "401":
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /acceleratorlab/scan/status:
    get:
      tags:
        - AcceleratorLab Scanner
      summary: Get scan progress and status
      description: >
        Returns current scan status including progress, countries processed, and any errors.
        Polls this endpoint during active scan to track progress in real-time.
      responses:
        "200":
          description: Status information
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [idle, running, completed, error]
                  progress:
                    type: object
                    properties:
                      current:
                        type: integer
                      total:
                        type: integer
                      percentage:
                        type: number
                      countries_completed:
                        type: integer
                      countries_remaining:
                        type: integer
                  current_country:
                    type: string
                    nullable: true
                  resumed:
                    type: boolean
                  last_run:
                    type: string
                    format: date-time
                    nullable: true
                  error:
                    type: string
                    nullable: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /acceleratorlab/scan/reset:
    post:
      tags:
        - AcceleratorLab Scanner
      summary: Clear all scan data
      description: >
        Deletes all processed country data to allow a fresh scan from scratch.
        WARNING: This is a destructive operation that cannot be undone!
        Requires API key authentication.
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Data cleared successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        "401":
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
  /acceleratorlab/country/{country_code}:
    get:
      tags:
        - AcceleratorLab Scanner
      summary: Get country classification results
      description: >
        Returns detailed classification results for a specific country including all
        discovered articles with their classifications (high/medium/low confidence AcceleratorLab content).
      parameters:
        - name: country_code
          in: path
          required: true
          schema:
            type: string
          description: ISO3 country code (e.g., "KEN" for Kenya)
      responses:
        "200":
          description: Country data found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryData'
        "404":
          description: Country not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - AcceleratorLab Scanner
      summary: Delete country data for re-processing
      description: >
        Removes processed data for a specific country, allowing it to be re-scanned
        in the next scan run. Useful for re-processing countries after classification improvements.
        Requires API key authentication.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: country_code
          in: path
          required: true
          schema:
            type: string
          description: ISO3 country code (e.g., "KEN" for Kenya)
      responses:
        "200":
          description: Country data deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        "401":
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
  /acceleratorlab/countries:
    get:
      tags:
        - AcceleratorLab Scanner
      summary: List all processed countries
      description: >
        Returns a list of ISO3 country codes for all countries that have been
        processed in the scan. Used to track which countries have been completed.
      responses:
        "200":
          description: List of countries
          content:
            application/json:
              schema:
                type: object
                properties:
                  countries:
                    type: array
                    items:
                      type: string
                    description: Array of ISO3 country codes
                  total:
                    type: integer
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /acceleratorlab/summary:
    get:
      tags:
        - AcceleratorLab Scanner
      summary: Get global classification summary
      description: >
        Returns aggregated statistics across all processed countries including total
        articles found, classifications by confidence level, and per-country breakdown.
      parameters:
        - name: refresh
          in: query
          required: false
          schema:
            type: boolean
          description: If true, recalculate summary from all country files instead of using cache
      responses:
        "200":
          description: Summary statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanSummary'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /acceleratorlab/health:
    get:
      tags:
        - AcceleratorLab Scanner
      summary: AcceleratorLab module health check
      description: Simple health check endpoint for the AcceleratorLab module
      responses:
        "200":
          description: Module is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  module:
                    type: string
                  status:
                    type: string
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
  schemas:
    EmbedPayload:
      type: object
      description: Parameters required by the embedding service. This object must be provided by the client.
      properties:
        token:
          type: string
          description: SDG Commons API token for embedding service
      required:
        - token
    ArticleData:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        content_length:
          type: integer
        content_source:
          type: string
        url:
          type: string
        country:
          type: string
        report_type:
          type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
    CountryData:
      type: object
      description: Detailed classification results for a specific country
      properties:
        country:
          type: string
          description: Country name
        country_code:
          type: string
          description: ISO3 country code
        total_articles:
          type: integer
          description: Total number of articles discovered
        classified_articles:
          type: object
          properties:
            high:
              type: integer
              description: Number of high confidence AcceleratorLab articles
            medium:
              type: integer
              description: Number of medium confidence AcceleratorLab articles
            low:
              type: integer
              description: Number of low confidence AcceleratorLab articles
        articles:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              url:
                type: string
              classification:
                type: string
                enum: [high, medium, low, not_relevant]
              confidence:
                type: number
                format: float
              content_length:
                type: integer
              date_published:
                type: string
                format: date-time
                nullable: true
    ScanSummary:
      type: object
      description: Aggregated statistics across all processed countries
      properties:
        total_countries:
          type: integer
          description: Total number of countries processed
        total_articles:
          type: integer
          description: Total articles discovered across all countries
        total_classified:
          type: object
          properties:
            high:
              type: integer
            medium:
              type: integer
            low:
              type: integer
        by_country:
          type: array
          items:
            type: object
            properties:
              country:
                type: string
              country_code:
                type: string
              total_articles:
                type: integer
              classified:
                type: object
                properties:
                  high:
                    type: integer
                  medium:
                    type: integer
                  low:
                    type: integer
        last_updated:
          type: string
          format: date-time
          nullable: true